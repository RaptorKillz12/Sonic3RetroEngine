name: Build RSDKv5 Engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Build RSDKv5 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: windows-latest
            platform: Windows

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout RSDKv5 source and submodules
        uses: actions/checkout@v4
        with:
          repository: RSDKModding/RSDKv5-Decompilation
          ref: master
          path: rsdk
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libogg-dev libtheora-dev libglfw3-dev libglew-dev

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install libogg libtheora glfw3 glew --triplet x64-windows

      - name: Configure RSDKv5 (Linux)
        if: runner.os == 'Linux'
        run: cmake -S rsdk -B rsdk/build -DCMAKE_BUILD_TYPE=Release -DRETRO_SUBSYSTEM=OGL -DRETRO_REVISION=3 -DRETRO_MOD_LOADER=ON

      - name: Configure RSDKv5 (Windows)
        if: runner.os == 'Windows'
        run: cmake -S rsdk -B rsdk/build -DCMAKE_BUILD_TYPE=Release -DRETRO_SUBSYSTEM=OGL -DRETRO_REVISION=3 -DRETRO_MOD_LOADER=ON -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
        shell: pwsh

      - name: Build RSDKv5
        run: cmake --build rsdk/build --config Release --parallel

      - name: Upload engine build
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv5-${{ matrix.platform }}
          path: |
            rsdk/build/RSDKv5*
            rsdk/build/Release/RSDKv5*
          if-no-files-found: error
          retention-days: 14

  physics-tests:
    name: Test player physics module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Compile physics tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic game/physics/PlayerPhysics.cpp game/physics/tests/PlayerPhysicsTests.cpp -o physics-tests
      - name: Run physics tests
        run: ./physics-tests

  gameplay-system-tests:
    name: Test gameplay systems
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Compile gameplay systems tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic game/systems/GameSystems.cpp game/systems/tests/GameSystemsTests.cpp -o gameplay-tests
      - name: Run gameplay systems tests
        run: ./gameplay-tests
